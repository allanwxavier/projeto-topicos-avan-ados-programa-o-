# ══════════════════════════════════════════════════════════════
#  SonarCloud — Configuração do projeto
# ══════════════════════════════════════════════════════════════

sonar.projectKey=allanwxavier_projeto-topicos-avan-ados-programa-o-
sonar.organization=allanwxavier

sonar.projectName=GestaoPedidos
sonar.projectVersion=1.0

# Exclusões de análise (pastas que não devem ser escaneadas)
sonar.exclusions=**/Migrations/**,**/dist/**,**/node_modules/**,**/vendor/**

# Exclusões de cobertura (pastas de teste)
sonar.coverage.exclusions=**/*Tests/**,**/*test*/**

# Aguardar o Quality Gate antes de retornar status
sonar.qualitygate.wait=true

# Caminho das fontes e testes para análise do SonarCloud
sonar.sources=backend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.ts,backend/tests/**/*.spec.ts
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
