# ════════════════════════════════════════════════════════════════════
#  DOCKER-COMPOSE — Projeto CQRS (versão entrega)
# ════════════════════════════════════════════════════════════════════

services:

  # 1. PostgreSQL (Node)
  postgres:
    image: postgres:15-alpine
    container_name: cqrs_postgres
    environment:
      POSTGRES_USER: meetsync
      POSTGRES_PASSWORD: meetsync123
      POSTGRES_DB: meetsync
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - microsaas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetsync"]
      interval: 5s
      retries: 5

  # 2. MySQL (Laravel)
  mysql:
    image: mysql:8.0
    container_name: cqrs_mysql
    environment:
      MYSQL_DATABASE: microsaas
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - microsaas-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5

  # 3. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cqrs_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - microsaas-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  # 4. Redis
  redis:
    image: redis:7-alpine
    container_name: cqrs_redis
    command: redis-server --requirepass admin123
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - microsaas-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Node.js API (Write Model)
  node-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cqrs_node_api
    ports:
      - "8081:8081"
    environment:
      - API_PORT=8081
      - NODE_ENV=development
      - DATABASE_URL=postgresql://meetsync:meetsync123@postgres:5432/meetsync?schema=public
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=segredo_super_secreto_do_trabalho
      - REDIS_HOST=cqrs_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microsaas-net
    restart: unless-stopped

  # 6. Laravel App (Read Model)
  laravel-app:
    build:
      context: ../todo-service/php-service
      dockerfile: Dockerfile
    container_name: cqrs_laravel_app
    volumes:
      - ../todo-service/php-service:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=microsaas
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - JWT_SECRET=segredo_super_secreto_do_trabalho
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      microsaas-net:
        aliases:
          - app
    restart: unless-stopped

  laravel-worker-reuniao:
    build:
      context: ../todo-service/php-service
      dockerfile: Dockerfile
    container_name: cqrs_laravel_worker_reuniao
    command: php artisan rabbitmq:consume-reuniao-criada
    volumes:
      - ../todo-service/php-service:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=microsaas
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - JWT_SECRET=segredo_super_secreto_do_trabalho
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      laravel-app:
        condition: service_started
    networks:
      - microsaas-net
    restart: unless-stopped

  laravel-worker-kanban:
    build:
      context: ../todo-service/php-service
      dockerfile: Dockerfile
    container_name: cqrs_laravel_worker_kanban
    command: php artisan rabbitmq:consume-kanban-events
    volumes:
      - ../todo-service/php-service:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=microsaas
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - JWT_SECRET=segredo_super_secreto_do_trabalho
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      laravel-app:
        condition: service_started
    networks:
      - microsaas-net
    restart: unless-stopped

  # 7. Nginx (Laravel webserver)
  laravel-webserver:
    image: nginx:alpine
    container_name: cqrs_laravel_web
    ports:
      - "8000:80"
    volumes:
      - ../todo-service/php-service:/var/www
      - ../todo-service/php-service/docker-config/nginx:/etc/nginx/conf.d
    depends_on:
      - laravel-app
    networks:
      - microsaas-net
    restart: unless-stopped

  # 7. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: cqrs_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheusdata:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microsaas-net
    restart: unless-stopped

  # 8. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: cqrs_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - microsaas-net
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:
  rabbitmqdata:
  redisdata:
  prometheusdata:
  grafanadata:

networks:
  microsaas-net:
    driver: bridge