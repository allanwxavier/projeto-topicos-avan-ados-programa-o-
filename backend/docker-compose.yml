services:
  # --- Banco de Dados PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: meetsync_db
    environment:
      POSTGRES_USER: meetsync
      POSTGRES_PASSWORD: meetsync123
      POSTGRES_DB: meetsync
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - microsaas-net

  # --- Backend Node.js ---
  backend:
    build:
      context: .
    container_name: meetsync_api
    ports:
      - "8082:8080" 
    environment:
      - API_PORT=8080
      - NODE_ENV=development
      - DATABASE_URL=postgresql://meetsync:meetsync123@postgres:5432/meetsync?schema=public
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - microsaas-net

volumes:
  pgdata:

networks:
  microsaas-net:
    external: true